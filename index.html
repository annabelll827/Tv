<!DOCTYPE html>
<html lang="ku" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova TV</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
        }

        .video-js {
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            overflow: hidden;
        }

        .vjs-big-play-button {
            background-color: rgba(6, 182, 212, 0.85) !important;
            border: none !important;
            border-radius: 50% !important;
            width: 2.2em !important;
            height: 2.2em !important;
            line-height: 2.2em !important;
            margin-top: -1.1em !important;
            margin-left: -1.1em !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen w-screen overflow-x-hidden pb-28 bg-[#0b0f19]"
      x-data="{
          currentTab: 'livetv',
          searchQuery: '',
          selectedCategory: 'All',
          categories: ['All', 'Sports', 'News', 'Movies', 'General', 'Kids'],
          
          // Player State
          activeChannelName: '',
          isPlayingModal: false,
          isYoutube: false,
          youtubeUrl: '',
          currentStream: '',

          // Admin Modal State
          showAdminModal: false,
          isAdminUnlocked: localStorage.getItem('nova_tv_admin') === 'true',
          adminInput: '',
          adminError: false,
          
          newChannelName: '',
          newChannelUrl: '',
          newChannelImage: '',
          newChannelIsYt: false,
          newChannelCategory: 'General',
          
          editingIndex: null,
          editName: '',
          editUrl: '',
          editImage: '',
          editIsYt: false,
          editCategory: 'General',

          // Empty Channels Array (No default channels)
          channels: JSON.parse(localStorage.getItem('nova_channels')) || [],

          // Encryption / Obfuscation helper for Stream URLs
          encodeData(str) {
              try {
                  return btoa(encodeURIComponent(str));
              } catch(e) { return str; }
          },

          decodeData(str) {
              try {
                  return decodeURIComponent(atob(str));
              } catch(e) { return str; }
          },

          get filteredChannels() {
              return this.channels.filter(ch => {
                  const matchesSearch = ch.name.toLowerCase().includes(this.searchQuery.toLowerCase());
                  const matchesCategory = this.selectedCategory === 'All' || (ch.category && ch.category === this.selectedCategory);
                  return matchesSearch && matchesCategory;
              });
          },

          openPlayer(channel) {
              this.activeChannelName = channel.name;
              this.isYoutube = channel.isYt;
              this.isPlayingModal = true;
              
              const rawUrl = this.decodeData(channel.url);

              if (channel.isYt) {
                  this.youtubeUrl = rawUrl;
                  if (window.player) window.player.pause();
              } else {
                  this.currentStream = rawUrl;
                  this.$nextTick(() => {
                      if (window.player) {
                          window.player.src({ src: rawUrl, type: 'application/x-mpegURL' });
                          window.player.load();
                          window.player.play().catch(e => console.log('Autoplay handled', e));
                      }
                  });
              }
          },

          closePlayer() {
              this.isPlayingModal = false;
              this.currentStream = '';
              this.youtubeUrl = '';
              if (window.player) window.player.pause();
          },

          checkAdmin() {
              if (this.adminInput.trim() === 'Vision Labs Krd') {
                  this.isAdminUnlocked = true;
                  localStorage.setItem('nova_tv_admin', 'true');
                  this.adminError = false;
                  this.showAdminModal = false;
                  this.adminInput = '';
                  this.currentTab = 'settings';
              } else {
                  this.adminError = true;
              }
          },

          lockAdmin() {
              this.isAdminUnlocked = false;
              localStorage.removeItem('nova_tv_admin');
              this.adminInput = '';
              this.currentTab = 'livetv';
          },

          handleImageUpload(event, type) {
              const file = event.target.files[0];
              if (file) {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                      if (type === 'new') this.newChannelImage = e.target.result;
                      else if (type === 'edit') this.editImage = e.target.result;
                  };
                  reader.readAsDataURL(file);
              }
          },

          addChannel() {
              if (!this.newChannelName || !this.newChannelUrl) return;
              
              const newCh = {
                  name: this.newChannelName,
                  url: this.encodeData(this.newChannelUrl.trim()),
                  image: this.newChannelImage || 'https://via.placeholder.com/300/1e293b/ffffff?text=' + encodeURIComponent(this.newChannelName),
                  isYt: this.newChannelIsYt,
                  category: this.newChannelCategory || 'General'
              };

              this.channels.push(newCh);
              localStorage.setItem('nova_channels', JSON.stringify(this.channels));

              this.newChannelName = '';
              this.newChannelUrl = '';
              this.newChannelImage = '';
              this.newChannelIsYt = false;
              this.newChannelCategory = 'General';
              const imgInput = document.getElementById('channelImageInput');
              if (imgInput) imgInput.value = '';
          },

          startEdit(index) {
              this.editingIndex = index;
              const ch = this.channels[index];
              this.editName = ch.name;
              this.editUrl = this.decodeData(ch.url);
              this.editImage = ch.image || '';
              this.editIsYt = ch.isYt || false;
              this.editCategory = ch.category || 'General';
          },

          cancelEdit() {
              this.editingIndex = null;
          },

          saveEdit(index) {
              if (!this.editName || !this.editUrl) return;
              this.channels[index] = {
                  name: this.editName,
                  url: this.encodeData(this.editUrl.trim()),
                  image: this.editImage || 'https://via.placeholder.com/300/1e293b/ffffff?text=' + encodeURIComponent(this.editName),
                  isYt: this.editIsYt,
                  category: this.editCategory
              };
              localStorage.setItem('nova_channels', JSON.stringify(this.channels));
              this.cancelEdit();
          },

          deleteChannel(index) {
              this.channels.splice(index, 1);
              localStorage.setItem('nova_channels', JSON.stringify(this.channels));
          },

          moveChannel(index, direction) {
              const newIndex = index + direction;
              if (newIndex < 0 || newIndex >= this.channels.length) return;
              const item = this.channels.splice(index, 1)[0];
              this.channels.splice(newIndex, 0, item);
              localStorage.setItem('nova_channels', JSON.stringify(this.channels));
          }
      }">

    <!-- Top Header -->
    <header class="pt-5 px-4 max-w-6xl mx-auto flex items-center justify-between gap-3">
        <h1 class="text-xl md:text-2xl font-extrabold text-white tracking-tight shrink-0">
            Nova TV
        </h1>

        <!-- Search Bar -->
        <div class="relative flex-1 max-w-md">
            <span class="absolute inset-y-0 left-3.5 flex items-center text-slate-400 pointer-events-none">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input 
                type="text" 
                x-model="searchQuery" 
                placeholder="Search channels..." 
                class="w-full bg-[#161c2e] border border-slate-800 text-xs text-white pl-9 pr-4 py-2.5 rounded-full focus:outline-none focus:border-cyan-500 transition-all placeholder:text-slate-500"
            />
        </div>

        <!-- Hidden Admin Trigger Button -->
        <button @click="if(!isAdminUnlocked){ showAdminModal = true; adminError = false; } else { currentTab = 'settings'; }" 
                :class="isAdminUnlocked ? 'bg-cyan-500/20 text-cyan-400 border-cyan-500/40' : 'bg-[#161c2e] text-slate-400 border-slate-800 hover:text-white'"
                class="w-10 h-10 rounded-full border flex items-center justify-center transition shrink-0">
            <i class="fa-solid fa-user-shield text-sm"></i>
        </button>
    </header>

    <!-- Main Content Tab: Live TV -->
    <main x-show="currentTab === 'livetv'" class="max-w-6xl mx-auto px-4 mt-5">
        
        <!-- Category Filter Pills -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3">
            <template x-for="cat in categories" :key="cat">
                <button 
                    @click="selectedCategory = cat"
                    :class="selectedCategory === cat ? 'bg-[#00a8ff] text-white font-bold shadow-lg shadow-cyan-500/25 border-[#00a8ff]' : 'bg-[#161c2e]/80 text-slate-400 hover:text-white border-slate-800'"
                    class="px-5 py-2 rounded-full text-xs transition-all border shrink-0"
                    x-text="cat">
                </button>
            </template>
        </div>

        <!-- Channel Cards Grid (3 Columns on Mobile) -->
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5 md:gap-4 mt-3">
            <template x-for="(channel, index) in filteredChannels" :key="index">
                <div @click="openPlayer(channel)" 
                     class="group relative aspect-square bg-[#161c2e] rounded-2xl overflow-hidden border border-slate-800/80 cursor-pointer shadow-md active:scale-95 transition-all duration-200">
                    
                    <!-- Channel Image Cover -->
                    <img :src="channel.image" :alt="channel.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                    
                    <!-- Bottom Dark Gradient & Title -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-2 text-center">
                        <span class="text-[11px] md:text-xs font-bold text-white tracking-wide truncate w-full drop-shadow" x-text="channel.name"></span>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="filteredChannels.length === 0" class="flex flex-col items-center justify-center py-20 text-slate-500 text-xs">
            <i class="fa-solid fa-tv text-4xl mb-3 text-slate-600"></i>
            هیچ کەناڵێک بەردەست نییە
        </div>
    </main>

    <!-- Movies Tab -->
    <main x-show="currentTab === 'movies'" class="max-w-6xl mx-auto px-4 mt-12 text-center text-slate-400">
        <i class="fa-solid fa-film text-4xl mb-3 text-cyan-400"></i>
        <h2 class="text-lg font-bold text-white">بەشی فیلمەکان</h2>
        <p class="text-xs text-slate-500 mt-1">بەم زووانە بەردەست دەبێت</p>
    </main>

    <!-- Series Tab -->
    <main x-show="currentTab === 'series'" class="max-w-6xl mx-auto px-4 mt-12 text-center text-slate-400">
        <i class="fa-solid fa-tv text-4xl mb-3 text-cyan-400"></i>
        <h2 class="text-lg font-bold text-white">بەشی زنجیرەکان</h2>
        <p class="text-xs text-slate-500 mt-1">بەم زووانە بەردەست دەبێت</p>
    </main>

    <!-- Profile Tab -->
    <main x-show="currentTab === 'profile'" class="max-w-6xl mx-auto px-4 mt-12 text-center text-slate-400">
        <i class="fa-solid fa-user-circle text-4xl mb-3 text-cyan-400"></i>
        <h2 class="text-lg font-bold text-white">پرۆفایل</h2>
        <p class="text-xs text-slate-500 mt-1">زانیاری هەژمارەکەت</p>
    </main>

    <!-- Settings Tab (Admin Panel Only Available when Logged In) -->
    <main x-show="currentTab === 'settings'" class="max-w-3xl mx-auto px-4 mt-6">
        <div x-show="isAdminUnlocked" class="bg-[#161c2e] border border-slate-800 rounded-3xl p-5 md:p-7 shadow-2xl space-y-6">
            <div class="border-b border-slate-800 pb-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-gear text-cyan-400"></i> بەڕێوەبردنی کەناڵەکان
                </h2>
                <button @click="lockAdmin()" class="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1 rounded-xl hover:bg-rose-500/20 transition">
                    دەرچوون
                </button>
            </div>

            <!-- Add Channel Form -->
            <div class="bg-[#0b0f19] p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider">زیادکردنی کەناڵی نوێ</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" x-model="newChannelName" placeholder="ناوی کەناڵ" class="bg-[#161c2e] border border-slate-700 px-3.5 py-2 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-500" />
                    <input type="file" id="channelImageInput" @change="handleImageUpload($event, 'new')" accept="image/*" class="bg-[#161c2e] border border-slate-700 px-3 py-1 rounded-xl text-xs text-slate-300 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyan-500 file:text-white cursor-pointer" />
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" x-model="newChannelUrl" placeholder="لینکی پەخش (.m3u8 یان iframe)" class="bg-[#161c2e] border border-slate-700 px-3.5 py-2 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-500" />
                    <select x-model="newChannelCategory" class="bg-[#161c2e] border border-slate-700 px-3.5 py-2 rounded-xl text-xs text-white focus:outline-none focus:border-cyan-500">
                        <template x-for="cat in categories.filter(c => c !== 'All')" :key="cat">
                            <option :value="cat" x-text="cat" class="bg-[#0b0f19] text-white"></option>
                        </template>
                    </select>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="isYtCheck" x-model="newChannelIsYt" class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0" />
                    <label for="isYtCheck" class="text-xs text-slate-300 cursor-pointer">ئایا ئەمە لینکی یوتیوب/ایفرەیمە؟</label>
                </div>

                <button @click="addChannel()" class="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white text-xs font-bold shadow-lg shadow-cyan-500/20 transition">زیادکردنی کەناڵ</button>
            </div>

            <!-- Manage Existing Channels -->
            <div class="space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">لیستی کەناڵەکان</h3>
                <div class="max-h-72 overflow-y-auto space-y-2 pr-1 no-scrollbar">
                    <template x-for="(channel, index) in channels" :key="index">
                        <div class="bg-[#0b0f19] p-3 rounded-2xl border border-slate-800 flex flex-col gap-2">
                            <div class="flex justify-between items-center" x-show="editingIndex !== index">
                                <div class="flex items-center gap-3">
                                    <img :src="channel.image" class="w-9 h-9 rounded-xl object-cover" />
                                    <div>
                                        <span class="text-xs font-bold text-white block" x-text="channel.name"></span>
                                        <span class="text-[10px] text-cyan-400" x-text="channel.category || 'General'"></span>
                                    </div>
                                </div>

                                <div class="flex items-center gap-1.5">
                                    <button @click="moveChannel(index, -1)" :disabled="index === 0" class="bg-slate-800 text-slate-300 px-2 py-1 rounded-lg text-xs disabled:opacity-30">
                                        <i class="fa-solid fa-arrow-up"></i>
                                    </button>
                                    <button @click="moveChannel(index, 1)" :disabled="index === channels.length - 1" class="bg-slate-800 text-slate-300 px-2 py-1 rounded-lg text-xs disabled:opacity-30">
                                        <i class="fa-solid fa-arrow-down"></i>
                                    </button>
                                    <button @click="startEdit(index)" class="bg-cyan-500/10 text-cyan-400 px-2.5 py-1 rounded-lg text-xs">دەستکاری</button>
                                    <button @click="deleteChannel(index)" class="bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded-lg text-xs">سڕینەوە</button>
                                </div>
                            </div>

                            <!-- Edit Box -->
                            <div x-show="editingIndex === index" class="space-y-2 p-2 bg-[#161c2e] rounded-xl">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" x-model="editName" class="bg-[#0b0f19] border border-slate-700 px-2.5 py-1.5 rounded text-xs text-white" />
                                    <input type="file" @change="handleImageUpload($event, 'edit')" accept="image/*" class="bg-[#0b0f19] border border-slate-700 px-2 py-1 rounded text-xs text-slate-300" />
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" x-model="editUrl" class="bg-[#0b0f19] border border-slate-700 px-2.5 py-1.5 rounded text-xs text-white" />
                                    <select x-model="editCategory" class="bg-[#0b0f19] border border-slate-700 px-2.5 py-1.5 rounded text-xs text-white">
                                        <template x-for="cat in categories.filter(c => c !== 'All')" :key="cat">
                                            <option :value="cat" x-text="cat"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="flex justify-end gap-2 pt-1">
                                    <button @click="cancelEdit()" class="bg-slate-700 text-slate-300 px-3 py-1 rounded text-xs">پاشگەزبوونەوە</button>
                                    <button @click="saveEdit(index)" class="bg-cyan-500 text-white px-3 py-1 rounded text-xs font-bold">پاشەکەوتکردن</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <!-- Admin Hidden Modal -->
    <div x-show="showAdminModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" style="display: none;">
        <div class="relative w-full max-w-sm bg-[#161c2e] border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center space-y-4">
            <button @click="showAdminModal = false" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 flex items-center justify-center mb-1">
                <i class="fa-solid fa-user-shield text-xl"></i>
            </div>

            <div class="w-full space-y-2">
                <input 
                    type="password" 
                    x-model="adminInput" 
                    @keyup.enter="checkAdmin()"
                    class="w-full bg-[#0b0f19] border border-slate-700 px-4 py-3 rounded-2xl text-xs text-center font-bold text-white focus:outline-none focus:border-cyan-500"
                    placeholder="کۆدەکە بنووسە"
                />
                <p x-show="adminError" class="text-rose-400 text-xs font-semibold">کۆدی بەڕێوەبەر هەڵەیە!</p>
            </div>

            <button @click="checkAdmin()" class="w-full py-3 rounded-2xl bg-cyan-500 hover:bg-cyan-400 font-bold text-xs text-white shadow-lg shadow-cyan-500/20 transition">
                چوونەژوورەوە
            </button>
        </div>
    </div>

    <!-- Video Player Popup Modal -->
    <div x-show="isPlayingModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-6 bg-black/90 backdrop-blur-md" style="display: none;">
        <div class="relative w-full max-w-4xl bg-[#161c2e] border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col">
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-5 py-3 border-b border-slate-800 bg-[#0b0f19]">
                <div class="flex items-center gap-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h3 class="text-sm font-bold text-white truncate" x-text="activeChannelName"></h3>
                </div>
                <button @click="closePlayer()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Video Player Area -->
            <div class="w-full aspect-video bg-black relative">
                <div x-show="!isYoutube" class="w-full h-full">
                    <video-js id="tvPlayer" class="vjs-big-play-centered" controls preload="auto" data-setup='{}'>
                        <source :src="currentStream" type="application/x-mpegURL" />
                    </video-js>
                </div>
                <div x-show="isYoutube" class="w-full h-full">
                    <iframe class="w-full h-full border-0" :src="youtubeUrl" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Navigation Bar -->
    <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 bg-[#161c2e]/90 backdrop-blur-2xl border border-slate-700/60 rounded-full px-5 py-2.5 flex items-center justify-between gap-6 shadow-2xl shadow-black/80">
        
        <!-- Live TV -->
        <button @click="currentTab = 'livetv'" 
                :class="currentTab === 'livetv' ? 'text-cyan-400 font-bold' : 'text-slate-400 hover:text-slate-200'" 
                class="flex flex-col items-center gap-1 transition">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px]">Live TV</span>
        </button>

        <!-- Movies -->
        <button @click="currentTab = 'movies'" 
                :class="currentTab === 'movies' ? 'text-cyan-400 font-bold' : 'text-slate-400 hover:text-slate-200'" 
                class="flex flex-col items-center gap-1 transition">
            <i class="fa-solid fa-border-all text-lg"></i>
            <span class="text-[10px]">Movies</span>
        </button>

        <!-- Series -->
        <button @click="currentTab = 'series'" 
                :class="currentTab === 'series' ? 'text-cyan-400 font-bold' : 'text-slate-400 hover:text-slate-200'" 
                class="flex flex-col items-center gap-1 transition">
            <i class="fa-solid fa-tv text-lg"></i>
            <span class="text-[10px]">Series</span>
        </button>

        <!-- Profile -->
        <button @click="currentTab = 'profile'" 
                :class="currentTab === 'profile' ? 'text-cyan-400 font-bold' : 'text-slate-400 hover:text-slate-200'" 
                class="flex flex-col items-center gap-1 transition relative">
            <i class="fa-regular fa-user text-lg"></i>
            <span class="text-[10px]">Profile</span>
            <span class="absolute -top-1 -right-2 bg-amber-500 text-black font-extrabold text-[8px] px-1 rounded-sm">B</span>
        </button>

        <!-- Settings (Only triggers Modal if locked, or opens Settings panel if unlocked) -->
        <button @click="if(!isAdminUnlocked){ showAdminModal = true; adminError = false; } else { currentTab = 'settings'; }"
